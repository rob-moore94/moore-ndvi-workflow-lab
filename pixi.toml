[workspace]
name = "ndvi-workflow-lab"
version = "0.1.0"
description = "GEOG 213/313 lab: build an NDVI time series workflow with an AI coding agent"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"
numpy = "*"
pandas = "*"
xarray = "*"
dask = "*"
geopandas = "*"
pyproj = "*"
shapely = "*"
pystac-client = "*"
planetary-computer = "*"
stackstac = ">=0.5.1"
matplotlib = "*"
pytest = ">=8"

[tasks]
# Run the tests
test = "python -m pytest -q"
# Run the full workflow (writes to outputs/)
workflow = "python -m ndvi_workflow"
# Throw away every uncommitted change and untracked file (use after a bad agent run)
reset = "git checkout -- . && git clean -fd"
